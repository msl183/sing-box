name: Build sing-box-tiny (aarch64_cortex-a53)

on:
  workflow_dispatch: # 支持手动点击按钮触发
    inputs:
      singbox_ref:
        description: '选择要编译的分支或 Tag (例如: main, v1.10.1)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.singbox_ref || 'main' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Build sing-box-tiny
        env:
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0          # 严格限定为 ARMv8.0-A 指令集，完美匹配 Cortex-A53
          CGO_ENABLED: 0        # 纯 Go 静态编译，免去跨平台 C 库依赖
        run: |
          # 自定义精简 Build Tags (只保留基础和轻量组件)
          TAGS="with_gvisor,with_quic,with_wireguard,with_ech,with_utls"
          
          # 执行编译并移除调试符号
          go build -v \
            -trimpath \
            -tags "$TAGS" \
            -ldflags "-s -w -buildid=" \
            -o sing-box-tiny-linux-arm64 \
            ./cmd/sing-box

      - name: Compress Binary with UPX (Optional)
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best --lzma sing-box-tiny-linux-arm64 || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tiny-aarch64-cortex-a53
          path: sing-box-tiny-linux-arm64
