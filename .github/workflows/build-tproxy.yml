name: Build latest sing-box TPROXY

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: '编译版本/分支 (例如: main, v1.11.0)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.singbox_ref || 'main' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Build sing-box Binary
        env:
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
          CGO_ENABLED: 0
        run: |
          go build -v \
            -trimpath \
            -tags "with_utls" \
            -ldflags "-s -w -buildid=" \
            -o sing-box-tproxy-aarch64 \
            ./cmd/sing-box

      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best --lzma sing-box-tproxy-aarch64 || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tproxy-latest-aarch64
          path: sing-box-tproxy-aarch64
